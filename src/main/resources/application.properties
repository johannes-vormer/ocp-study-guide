spring.application.name=ocp-trainer
server.port=8025
server.address=127.0.0.1

# Content (docs/ and practice/) is read from this directory; default = working directory
ocp.content-dir=.

# Progress database (SQLite file, created on first start)
spring.datasource.url=jdbc:sqlite:${ocp.content-dir}/data/progress.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

spring.thymeleaf.cache=false
