<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments :: nav('home')}"></header>
<main>
    <section class="cards">
        <div class="card stat">
            <div class="label">Exam</div>
            <div class="value" th:if="${daysLeft != null}"><span th:text="${daysLeft}">20</span> days</div>
            <div class="sub" th:if="${examDate != null}" th:text="${#temporals.format(examDate, 'EEE d MMM yyyy')}"></div>
            <form method="post" action="/settings" class="inline">
                <input type="date" name="examDate" th:value="${examDate}" required>
                <button type="submit" class="small">Set</button>
            </form>
        </div>
        <div class="card stat">
            <div class="label">Study plan</div>
            <div class="value"><span th:text="${planDone}">0</span>/<span th:text="${planTotal}">20</span> days</div>
            <div class="sub" th:if="${nextDay != null}">Next: <a href="/plan" th:href="'/plan#day-' + ${nextDay.day}" th:text="'Day ' + ${nextDay.day} + ' — ' + ${nextDay.title}"></a></div>
        </div>
        <div class="card stat">
            <div class="label">Questions seen</div>
            <div class="value"><span th:text="${overall.seen}">0</span>/<span th:text="${overall.total}">0</span></div>
            <div th:replace="~{fragments :: bar(${overall.seenPct}, '')}"></div>
        </div>
        <div class="card stat">
            <div class="label">Accuracy (latest attempt)</div>
            <div class="value" th:text="${overall.accuracy != null} ? ${overall.accuracy} + '%' : '—'">—</div>
            <div class="sub">Exam pass mark ≈ 68%</div>
        </div>
    </section>

    <section class="card">
        <h2>Activity — last 4 weeks</h2>
        <div class="activity">
            <div th:each="a : ${activity}" class="day"
                 th:title="${#temporals.format(a.first, 'EEE d MMM')} + ': ' + ${a.second} + ' answered, ' + ${a.third} + ' correct'">
                <span class="col" th:style="'height:' + ${a.second > 0 ? (a.second > 60 ? 100 : 10 + a.second * 90 / 60) : 0} + '%'"></span>
            </div>
        </div>
    </section>

    <section class="card">
        <h2>Progress by exam domain</h2>
        <table class="grid">
            <thead><tr><th>Domain</th><th>Summary</th><th>Seen</th><th>Accuracy</th><th>Mastered</th><th></th></tr></thead>
            <tbody>
            <tr th:each="t : ${topics}">
                <td th:text="${t.title}"></td>
                <td>
                    <span th:if="${t.progress == null}" class="pill">not started</span>
                    <span th:if="${t.progress != null}" class="pill" th:classappend="${t.progress.status}" th:text="${t.progress.status}"></span>
                </td>
                <td><span th:text="${t.stats.seen} + '/' + ${t.stats.total}"></span></td>
                <td th:text="${t.stats.accuracy != null} ? ${t.stats.accuracy} + '%' : '—'"
                    th:classappend="${t.stats.accuracy != null and t.stats.accuracy < 68} ? 'weak'"></td>
                <td><div th:replace="~{fragments :: bar(${t.stats.mastery}, 'small')}"></div></td>
                <td class="actions">
                    <form method="post" action="/practice/start" class="inline" th:if="${t.stats.total > 0}">
                        <input type="hidden" name="scope" th:value="'topic:' + ${t.id}">
                        <input type="hidden" name="filter" value="todo">
                        <input type="hidden" name="count" value="20">
                        <input type="hidden" name="shuffle" value="true">
                        <button class="small">20 to do</button>
                    </form>
                    <form method="post" action="/practice/start" class="inline" th:if="${t.stats.wrong > 0}">
                        <input type="hidden" name="scope" th:value="'topic:' + ${t.id}">
                        <input type="hidden" name="filter" value="wrong">
                        <button class="small secondary" th:text="'Mistakes (' + ${t.stats.wrong} + ')'"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="card" th:if="${!#lists.isEmpty(sessions)}">
        <h2>Recent sessions</h2>
        <table class="grid">
            <thead><tr><th>#</th><th>Session</th><th>Mode</th><th>Started</th><th>Score</th><th></th></tr></thead>
            <tbody>
            <tr th:each="s : ${sessions}">
                <td th:text="${s.session.id}"></td>
                <td th:text="${s.session.title}"></td>
                <td><span class="pill" th:text="${s.session.mode}"></span></td>
                <td th:text="${#temporals.format(s.session.startedAt, 'd MMM HH:mm')}"></td>
                <td th:text="${s.correct} + '/' + ${s.answered} + ' answered of ' + ${#lists.size(s.session.questionIds)}"></td>
                <td>
                    <a th:if="${s.session.finishedAt == null}" th:href="'/session/' + ${s.session.id} + '/q/' + ${s.answered < #lists.size(s.session.questionIds) ? s.answered : 0}">continue</a>
                    <a th:href="'/session/' + ${s.session.id} + '/result'">results</a>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <form method="post" action="/reload" class="footer-actions">
        <button class="small secondary" title="Re-read docs/ and practice/ markdown files">Reload content</button>
    </form>
</main>
</body>
</html>
