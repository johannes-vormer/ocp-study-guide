<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Study')}"></head>
<body>
<header th:replace="~{fragments :: nav('study')}"></header>
<main>
    <section class="card">
        <h2>Topic summaries — read these before practising</h2>
        <table class="grid">
            <thead><tr><th>Domain</th><th>Status</th><th>Confidence</th><th>Self-check</th><th>Questions</th></tr></thead>
            <tbody>
            <tr th:each="t : ${topics}" th:if="${topicDocs[t.id] != null}">
                <td><a th:href="'/study/' + ${topicDocs[t.id].id}" th:text="${topicDocs[t.id].title}"></a></td>
                <td>
                    <span th:if="${t.progress == null}" class="pill">not started</span>
                    <span th:if="${t.progress != null}" class="pill" th:classappend="${t.progress.status}" th:text="${t.progress.status}"></span>
                </td>
                <td class="stars" th:text="${t.progress != null} ? ${#strings.repeat('★', t.progress.confidence) + #strings.repeat('☆', 5 - t.progress.confidence)} : '☆☆☆☆☆'"></td>
                <td th:with="d=${topicDocs[t.id]}, c=${checkedCounts[topicDocs[t.id].id] ?: 0}">
                    <span th:if="${d.taskCount > 0}"
                          th:text="${(c > d.taskCount ? d.taskCount : c) + '/' + d.taskCount}"
                          th:classappend="${c >= d.taskCount} ? 'complete'"></span>
                    <span th:if="${d.taskCount == 0}">—</span>
                </td>
                <td th:text="${t.stats.total}"></td>
            </tr>
            </tbody>
        </table>
    </section>
    <section class="card">
        <h2>Other documents</h2>
        <ul class="doclist">
            <li th:each="d : ${otherDocs}"><a th:href="'/study/' + ${d.id}" th:text="${d.title}"></a></li>
        </ul>
    </section>
</main>
</body>
</html>
